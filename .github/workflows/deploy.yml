name: Deploy

#  Pipeline: every merge/push to main ships to production in three gated stages —
#    build-backend and build-frontend (native and next → ghcr) → smoke-test on THOSE images
#    (health plus a REAL photo upload) → deploy over ssh (pull, restart, health).

#  • The native compile runs HERE because the VPS is too small for it (needs 6-8 GB).
#  • Tests are deliberately NOT run here — pr-build.yml gates them on the PR.

#  • The smoke stage exists because "native image built" ≠ "native image runs": GraalVM strips
#    code it cannot reach statically, and those failures surface only at runtime. The riskiest
#    path here is java.awt/ImageIO (film slice), so the smoke uploads a real zip end to end.

on:
  push:
    branches: [ main ]
  # Manual start from the Actions tab, needed when the push trigger did not fire: a run queued
  # during an Actions outage hangs in `queued` forever and rerun has no effect on it
  # ("This workflow is already running"), leaving no other way to redeploy without an empty commit.
  workflow_dispatch:

# Serialize deploys: a second push waits for the running deploy instead of racing it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend
  CADDY_IMAGE: ghcr.io/${{ github.repository }}/caddy

jobs:

  # ── Stage 1a: compile the native backend image and push it to the registry ────────────
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # native-image wants ~6 GB heap and the standard runner has ~8 GB RAM total.

      # The swap is a safety net so heap + Gradle + dockerd can't trip the OOM killer.
      # NB: the swapfile lives on /mnt (the runner's temporary disk) rather than the root, so it
      # takes no space from buildkit — see the next step.
      - name: Add swap for the native build
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # ⚠️ The runner's root disk is this job's bottleneck, and it failed here:
      # `ResourceExhausted: write /var/lib/buildkit/.../ingest/...: no space left on device`.
      # buildkit's state lives on the root disk, where ubuntu-latest leaves ONLY 4.9 GB free —

      # not enough for a native build plus exporting layers to cache.

      # Only the TWO heaviest directories are removed, not everything. This step runs on EVERY
      # backend build, including the majority that come straight from cache and need no disk at
      # all, so its cost is always paid and should stay low.

      # Measured: the first version removed seven paths plus `docker image prune` and took 71s and
      # 181s on two runs, while the prune freed just 1.8 GB of 27. Walking small directories cost
      # disproportionately, so the small fry and the prune are gone.

      # Removal uses a plain `rm` rather than a third-party action: there is nothing to reuse here,
      # while someone else's action in the deploy chain is another pair of hands on our secrets.

      # `df` is printed before and after DELIBERATELY: if this job hits the disk again, the first
      # question will be how much there was, and the answer belongs in the log. The duration is
      # printed for the same reason — the next "why is the build slower" starts from a number.
      - name: Free up runner disk
        run: |
          df -h /
          start=$(date +%s)
          # android ~9-14 GB and CodeQL ~5 GB together take 4.9 GB up to ~20 GB, which is ample:
          # what did not fit before was the remainder of 4.9, not of twenty.
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          echo "cleanup took $(( $(date +%s) - start ))s"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The sha tag is the rollback handle (docs/deploy.md §5).

      # ⚠️ `mode=max` is mandatory, not a precaution. The whole builder stage is cached, including
      # the native compile layer, and that layer depends only on `backend/`, which changes rarely —

      # so deploying a FRONTEND change reuses it and `build-backend` finishes in ~35s to 1.5min.

      # Rejected: `mode=min`, tried to save disk — the cache export shrank to zero layers and stopped
      # updating at all, so the first change in `backend/` would have left every later deploy without
      # that layer. Space for the export comes from "Free up runner disk" above.
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.native
          push: true
          build-args: |
            NATIVE_IMAGE_XMX=6g
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ── Stage 1b: build the Next.js frontend image ────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build args are baked at build time (Next rewrites + prerendered robots/sitemap/OG):
      # API_PROXY_TARGET is the SSR-side fallback proxy target inside the compose network;

      # browser /api/* traffic is routed by Caddy straight to the backend.
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            API_PROXY_TARGET=http://backend:8080
            SITE_URL=https://danchuo.world
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Stage 1c: build the edge image (caddy + rate limiter + cache) ─────────────────────
  # Small and cheap next to the other two, but it has to exist before deploy: the Caddyfile uses
  # directives stock caddy:2 cannot parse, so validation and the running edge both need it.
  build-caddy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: caddy
          push: true
          tags: |
            ${{ env.CADDY_IMAGE }}:latest
            ${{ env.CADDY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

  # ── Stage 1d: the Caddyfile must parse against the image that will serve it ───────────
  # Runs here rather than on the VPS, so a broken edge config fails the build in a minute, before
  # anything is pulled. The on-server validation stays too — that one proves the landed file good.
  validate-edge-config:
    needs: build-caddy
    runs-on: ubuntu-latest
    permissions:
      # `contents: read` is NOT optional here, and its absence does not look like a permissions
      # problem: declaring a `permissions:` block drops every scope left out, so checkout loses read
      # access and GitHub reports the private repo as "Repository not found", a 404 for a 403.

      # Any job in this file that checks out the repo needs this line; smoke-test omits it only
      # because it never checks out.
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            ${{ env.CADDY_IMAGE }}:${{ github.sha }} \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # ── Stage 2: run the freshly built images and exercise the real request paths ─────────
  smoke-test:
    needs: [ build-backend, build-frontend ]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Postgres and the backend image under test
        run: |
          docker network create smoke

          docker run -d --name pg --network smoke \
            -e POSTGRES_USER=danchuo -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=danchuo \
            postgres:17-alpine

          docker run -d --name app --network smoke -p 8080:8080 \
            -e DANCHUO_DB_URL=jdbc:postgresql://pg:5432/danchuo \
            -e DANCHUO_DB_USER=danchuo \
            -e DANCHUO_DB_PASSWORD=smoke \
            -e DANCHUO_INGEST_TOKEN=smoke-token \
            -e DANCHUO_ANALYTICS_SALT=smoke-salt \
            -e DANCHUO_FILM_DIR=/tmp/film \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      # Readiness includes the Agroal datasource check → "ready" = Liquibase ran + DB is up.
      - name: Wait until the backend is ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/q/health/ready > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "::error::smoke: backend never became ready"; docker logs app; exit 1

      # THE native-image test a health ping cannot give: a real photo-drop upload runs zip → ImageIO
      # decode → AWT resize → JPEG encode → disk → DB, i.e. every JNI library quarkus-awt bundled.
      # If GraalVM stripped or mispacked any of it, this fails here rather than in production.
      - name: Upload a photo drop through the full imaging pipeline
        run: |
          # 1×1 PNG, base64 — deterministic test frames without extra tooling on the runner.
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" \
            | base64 -d > frame1.png
          cp frame1.png frame2.png
          zip -q drop.zip frame1.png frame2.png

          RESULT=$(curl -fsS -X POST http://localhost:8080/api/ingest/drops \
            -H "Authorization: Bearer smoke-token" \
            -F "zip=@drop.zip;type=application/zip" \
            -F "title=smoke drop" \
            -F "date=$(date -u +%F)") \
            || { echo "::error::smoke: drop upload failed"; docker logs app; exit 1; }
          echo "$RESULT" | jq -e '.processed == 2 and .skipped == 0' > /dev/null \
            || { echo "::error::smoke: expected 2 processed frames, got: $RESULT"; docker logs app; exit 1; }

      - name: Assert public read API serves the drop and its media
        run: |
          DROPS=$(curl -fsS http://localhost:8080/api/drops)
          echo "$DROPS" | jq -e '.[0].photoCount == 2 and .[0].coverPhotoUrl != null' > /dev/null \
            || { echo "::error::smoke: /api/drops mismatch: $DROPS"; docker logs app; exit 1; }

          # The resized JPEG must actually come back from storage (media serving path).
          COVER=$(echo "$DROPS" | jq -r '.[0].coverPhotoUrl')
          curl -fsS "http://localhost:8080$COVER" -o cover.jpg
          [ -s cover.jpg ] || { echo "::error::smoke: cover image is empty"; exit 1; }

          # Public day read: assert SHAPE, not just 200 — Response-wrapped DTOs that miss
          # reflection registration serialize as {} in native (caught live once already).
          DAY=$(curl -fsS "http://localhost:8080/api/days/$(date -u +%F)")
          echo "$DAY" | jq -e '.date != null and (.discipline | type == "array")' > /dev/null \
            || { echo "::error::smoke: /api/days serialized wrong (native reflection?): $DAY"; docker logs app; exit 1; }

          # Same shape guard for the unconfigured Spotify slice (must be a non-empty object).
          NOW=$(curl -fsS http://localhost:8080/api/spotify/now-playing)
          echo "$NOW" | jq -e 'length > 0' > /dev/null \
            || { echo "::error::smoke: /api/spotify/now-playing serialized wrong: $NOW"; docker logs app; exit 1; }

      - name: Run the frontend image against the smoke backend
        run: |
          docker run -d --name web --network smoke -p 3000:3000 \
            -e API_INTERNAL_URL=http://app:8080 \
            -e SITE_URL=https://danchuo.world \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ -o page.html 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::smoke: frontend never answered"; docker logs web; exit 1
          fi
          grep -qi "danchuo" page.html \
            || { echo "::error::smoke: frontend page looks empty"; docker logs web; exit 1; }

          echo "smoke OK — native backend serves ingest+read+media, frontend SSRs against it"

  # ── Stage 3: roll the VPS onto the new images ─────────────────────────────────────────
  deploy:
    needs: [ smoke-test, validate-edge-config ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the compose file, Caddyfile, WebDAV config and backup script on the VPS in sync with
      # the repo, so an edge config change deploys itself and nobody edits the server copies by hand.
      - name: Sync compose + Caddyfile + webdav config + backup script to the VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile,webdav.yml,ops/backup.sh"
          target: /opt/danchuoworld

      - name: Pull new images and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/danchuoworld
            export TAG=${{ github.sha }}

            # Pin the rolled-out tag in .env, which compose reads on its own. Without it the images
            # resolve as ${TAG:-latest}, so ANY hand-run `docker compose up -d` on this box silently
            # rolls production back to whatever `:latest` is cached on disk.

            # That cached copy is ancient, because deploys only ever pull the sha tag. Not
            # hypothetical: a manual restart of caddy once dragged the backend back fifteen
            # releases, and nothing anywhere said so.
            sed -i '/^TAG=/d' .env
            echo "TAG=${TAG}" >> .env

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # The Caddyfile is bind-mounted as a single FILE, and that mount is pinned to the
            # inode: scp replaces the file (new inode), the running container keeps the old one.

            # So the edge kept serving a config nobody could see any more, and `caddy reload` did
            # NOT help: it re-reads the path INSIDE the container, gets the stale file, and that
            # file is still valid and reloads green. Only recreating the container re-resolves it.

            # Validation therefore runs first in a throwaway container, so a broken Caddyfile fails
            # the deploy instead of taking the edge down on restart.

            # Validate with OUR image, not caddy:2 — the config uses rate_limit and cache, which
            # stock Caddy cannot parse, so validating against caddy:2 would fail every deploy on a
            # perfectly good file.
            docker run --rm -v /opt/danchuoworld/Caddyfile:/etc/caddy/Caddyfile:ro \
              ghcr.io/danchuo/danchuo.world/caddy:${TAG} \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

            # Every service whose config arrives as a bind-mounted file has to be recreated for the
            # same reason, and webdav.yml is the other one. Recreating unconditionally is the cheap,
            # boring guarantee: a second of downtime beats a config that looks deployed and is not.

            # Rule for anything added later: bind-mount a config file, recreate that service here too.
            docker compose -f docker-compose.prod.yml up -d --force-recreate caddy webdav

            # Backend health via its loopback port (8081; 8080 belongs to proxemics).
            # Green = Liquibase ran against the prod DB and the datasource is live.
            ok=""
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8081/q/health > /dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "::error::backend did not become healthy within 60s — recent logs:"
              docker logs --tail 100 danchuoworld-backend
              exit 1
            fi

            # End-to-end through Caddy: soft check — on the very first deploy DNS/ACME may
            # still be settling, and that shouldn't mark an otherwise healthy roll as failed.
            curl -fsS --max-time 15 https://danchuo.world > /dev/null \
              && echo "site answers over HTTPS" \
              || echo "::warning::https://danchuo.world not reachable yet (DNS/certificate still settling?)"

            # Edge gate, deliberately a HARD one. It probes the exact URL typed into Anx Reader — no
            # trailing slash, no credentials — which must come back 401 from the WebDAV server, since
            # anything else means the request reached Next.js and the phone reports a failed sync.

            # This is the check that turns a silently stale edge into a red deploy: the bug class
            # here is a rollout that reports success while serving the old config, so the last word
            # belongs to a request that only passes on the new one.
            dav=""
            for i in $(seq 1 5); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
                -X PROPFIND https://danchuo.world/dav || echo "000")
              if [ "$code" = "401" ]; then dav=ok; break; fi
              sleep 3
            done
            if [ -z "$dav" ]; then
              echo "::error::https://danchuo.world/dav answered $code, expected 401 — the edge is not serving the deployed Caddyfile (stale bind mount?) or the webdav container is down"
              docker compose -f docker-compose.prod.yml ps
              docker logs --tail 50 danchuoworld-caddy
              exit 1
            fi
            echo "WebDAV shelf answers on /dav (401 = auth challenge, route is live)"

            # Drop superseded images so old deploys don't fill the disk (dangling only —
            # never touches the proxemics stack's tagged images).
            docker image prune -f
            echo "deployed $TAG"

  # ── Stage 4: record the rollout as a GitHub Release ────────────────────────────────────
  # One lightweight release per successful production rollout. The payload is the pair of GHCR image
  # links pinned to the commit sha, and that sha tag is the rollback handle (docs/deploy.md §5).

  # Sources are not attached: GitHub links the source archive to the tag automatically, and the
  # images already pin the exact commit.
  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the rollout release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BACK_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/build.gradle.kts | head -1)
          FRONT_VER=$(node -p "require('./frontend/package.json').version")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="prod-${{ github.run_number }}"

          {
            echo "Rolled \`${{ github.sha }}\` to production — https://danchuo.world"
            echo
            echo "**Versions:** backend \`$BACK_VER\` · frontend \`$FRONT_VER\`"
            echo
            echo "**Images (sha tag = rollback handle, docs/deploy.md §5):**"
            echo "- \`${{ env.BACKEND_IMAGE }}:${{ github.sha }}\`"
            echo "- \`${{ env.FRONTEND_IMAGE }}:${{ github.sha }}\`"
            echo "- \`${{ env.CADDY_IMAGE }}:${{ github.sha }}\`"
          } > notes.md

          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "prod #${{ github.run_number }} — back $BACK_VER / front $FRONT_VER ($SHORT_SHA)" \
            --notes-file notes.md
