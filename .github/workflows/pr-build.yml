name: PR · build and tests

# Pull-request gate: on a PR into main the backend is built with its tests.
# A failed build or test turns the job red, so the PR cannot be merged (when the check is required).
on:
  pull_request:
    branches: [ main ]

# A new push to the PR branch cancels the previous run if it is still going.
concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + tests (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 25 is the stack's canon. The runner installs the JDK and sets JAVA_HOME.
      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      # `build` pulls `test` with it (Dev Services raises Postgres in the runner's Docker).
      # `org.gradle.java.home` in gradle.properties points at the developer's Windows path, so it is
      # overridden with the runner's JAVA_HOME or the Gradle daemon never starts.
      - name: Build with tests
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

      # Test reports as an artifact, so failures can be examined rather than guessed at.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Tests + build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Comment budget (CLAUDE.md): a block over 3 lines, or Cyrillic, turns the PR red. The check
      # covers the whole repository and lives here because Node is already set up at this point.
      - name: Check the comment budget
        run: node scripts/check-comment-budget.mjs

      # Doc references (CLAUDE.md "Text density"): a backticked path or code name in the docs
      # that the code no longer has turns the PR red, so a rename cannot leave the docs behind.
      - name: Check doc references
        run: node scripts/check-doc-refs.mjs

      # Tests (Vitest), type check and the production Next.js build.
      - name: Tests and build
        working-directory: frontend
        run: |
          npm run test
          npm run typecheck
          npm run build
