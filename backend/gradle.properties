quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.31.2

# JDKs for the toolchain (Java 25 is the canon, Java 17 the fallback)
org.gradle.java.installations.paths=D:/Programms/Java/jdk-25,D:/Programms/Java/jdk-17

# The Gradle daemon itself runs on JDK 25: Quarkus augmentation executes build steps inside
# Gradle's JVM and must be able to load our bytecode.
org.gradle.java.home=D:/Programms/Java/jdk-25

org.gradle.caching=true
org.gradle.parallel=true
