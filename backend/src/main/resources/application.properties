# ───────────── danchuo.world · backend (M0 — каркас) ─────────────
quarkus.application.name=danchuo-world
quarkus.http.port=8080

# ── Сквозные соглашения времени (PRD §4, CLAUDE.md): канон MSK + генезис ──
danchuo.time.zone=Europe/Moscow
danchuo.time.genesis=2026-01-01

# ── Креды записи (PRD §3, §7): статический bearer на /api/ingest/*; все GET публичны.
#    В dev — дефолт для удобства; в prod ОБЯЗАТЕЛЬНО из env DANCHUO_INGEST_TOKEN.
danchuo.ingest.token=${DANCHUO_INGEST_TOKEN:dev-ingest-token-change-me}

# CORS не нужен: фронт ходит к API на тот же origin через reverse-proxy (Caddy в проде,
# Next-прокси /api/* в docker-compose). Архитектура same-origin (CLAUDE.md §архитектура).

# ── Datasource (PostgreSQL) ──
quarkus.datasource.db-kind=postgresql

# ── Liquibase: конвейер миграций (вместо Flyway). Схемой владеет Liquibase, не hbm2ddl.
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml
quarkus.hibernate-orm.database.generation=none
# JSONB-колонки (theme.tokens, M4): Hibernate использует свой JSON-формат, а не REST-Jackson
# (мы не кастомизируем сериализацию токенов). Это станет дефолтом в будущих версиях Quarkus.
quarkus.hibernate-orm.mapping.format.global=ignore

# ── Spotify (PRD §M3): внешний OAuth + кэш, изолированы в слайсе spotify. ──
#    До регистрации приложения поля пусты — слайс отдаёт «not_configured», не падает.
#    Секреты в prod — строго из env (ниже в %prod), в dev — пустые дефолты.
danchuo.spotify.client-id=${DANCHUO_SPOTIFY_CLIENT_ID:}
danchuo.spotify.client-secret=${DANCHUO_SPOTIFY_CLIENT_SECRET:}
# Spotify требует https; исключение — loopback-IP по http (127.0.0.1, не localhost).
danchuo.spotify.redirect-uri=${DANCHUO_SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/api/spotify/callback}
# Ключ AES-256 для шифрования refresh-токена at-rest: Base64 32 байта (openssl rand -base64 32).
danchuo.spotify.token-encryption-key=${DANCHUO_SPOTIFY_TOKEN_KEY:}

# Базовые URL внешнего Spotify (вынесены в конфиг — тест может подменить на mock-сервер).
quarkus.rest-client.spotify-accounts.url=https://accounts.spotify.com
quarkus.rest-client.spotify-api.url=https://api.spotify.com

# Кэш гасит нагрузку и держит лимиты Spotify (PRD §8, §M3 exit): now-playing ~20с,
# recent/top — минуты. TTL у кэша-владельца, рядом со слайсом.
quarkus.cache.caffeine.spotify-now-playing.expire-after-write=20S
quarkus.cache.caffeine.spotify-recent.expire-after-write=5M
quarkus.cache.caffeine.spotify-top.expire-after-write=30M
# Имена плейлистов/артистов почти не меняются — кэшируем подольше (доп. запрос на имя источника).
quarkus.cache.caffeine.spotify-source-name.expire-after-write=30M

# ── Велобайк (PRD §9 B4): история поездок, внешний источник изолирован в слайсе bike. ──
#    Канал push (ingest из браузера/шортката) работает без конфига. Серверный поллинг —
#    только при заданном ключе шифрования И прокси (API за Qrator, §13): по умолчанию выкл.
#    Секреты в prod — строго из env. Телефон владельца — формат 79XXXXXXXXX.
danchuo.bike.phone=${DANCHUO_BIKE_PHONE:}
danchuo.bike.token-encryption-key=${DANCHUO_BIKE_TOKEN_KEY:}
danchuo.bike.poll-enabled=${DANCHUO_BIKE_POLL_ENABLED:false}
danchuo.bike.poll-interval=${DANCHUO_BIKE_POLL_INTERVAL:6h}
# Публичный GET /api/rides отдаёт поездки текущего календарного года (MSK); если год пустой —
# одну самую свежую (последняя прошлого сезона). Хранятся все запушенные.

# URL внешнего API Велобайк (тест/прокси могут подменить). Резидентный прокси для обхода
# Qrator задаётся здесь же при включении поллинга, напр.:
#   quarkus.rest-client.velobike.proxy-address=user-proxy-host:1080
quarkus.rest-client.velobike.url=https://pwa.velobike.ru

# Геокодер станций (PRD §5.13): карта рисует пины по сырому GPS велосипеда, который в Москве часто
# «улетает» (Шереметьево). Адрес станции надёжный, но её координат Велобайк не отдаёт — поэтому
# фоном геокодим адрес (OSM Nominatim) по одному за тик и кэшируем; лента предпочитает станцию GPS.
danchuo.bike.geocode.enabled=${DANCHUO_BIKE_GEOCODE_ENABLED:true}
danchuo.bike.geocode.interval=${DANCHUO_BIKE_GEOCODE_INTERVAL:5s}
danchuo.bike.geocode.user-agent=${DANCHUO_BIKE_GEOCODE_UA:danchuo.world/1.0 (https://danchuo.world)}
quarkus.rest-client.nominatim.url=${NOMINATIM_URL:https://nominatim.openstreetmap.org}
quarkus.rest-client.nominatim.read-timeout=10000

# ── LLM (PRD §9 backlog): external model provider, isolated in the `llm` slice (like spotify/bike).
#    Groq's OpenAI-compatible API (https://console.groq.com/keys). Empty api-key ⇒ no external
#    calls, LlmClient returns null and callers degrade gracefully. Secrets in prod — env only.
#    `model` — text completions; `vision-model` — image inputs (photo-drop orientation checks).
#    `provider` picks the implementation: groq (default) or gemini.
danchuo.llm.provider=${DANCHUO_LLM_PROVIDER:groq}
danchuo.llm.api-key=${DANCHUO_LLM_API_KEY:}
danchuo.llm.model=${DANCHUO_LLM_MODEL:llama-3.3-70b-versatile}
#    NB: Groq withdrew llama-4-scout — any vision call with it returns 404, which the client turns
#    into a silent null. qwen3.6-27b is the only vision model Groq still serves, and it needs
#    `reasoning_effort: none` or it spends the whole budget thinking. Measured against Gemini on
#    real drop frames it also states object coordinates unusably (see PRD §5.12), hence the switch.
danchuo.llm.vision-model=${DANCHUO_LLM_VISION_MODEL:qwen/qwen3.6-27b}
#    `none` гасит размышления вслух — без этого qwen тратит весь лимит ответа на <think> и
#    обрывается, не дойдя до ответа (снаружи выглядит как «модель не смогла»). Пусто — не слать
#    параметр вовсе: модели, которые его не знают, отвергают запрос целиком.
danchuo.llm.reasoning-effort=${DANCHUO_LLM_REASONING_EFFORT:none}
quarkus.rest-client.groq.url=${GROQ_URL:https://api.groq.com}

# ── Gemini (Google AI Studio): used when danchuo.llm.provider=gemini. Same degradation contract —
#    empty api-key ⇒ no external call, null reply. Unlike Groq it constrains replies to a JSON
#    schema and returns box coordinates as [ymin, xmin, ymax, xmax] scaled 0..1000 (y first).
#    Free tier is 20 requests/day per model — enough to smoke-test, not to sweep a drop.
danchuo.gemini.api-key=${GEMINI_API_KEY:}
danchuo.gemini.model=${DANCHUO_GEMINI_MODEL:gemini-3.5-flash}
danchuo.gemini.vision-model=${DANCHUO_GEMINI_VISION_MODEL:gemini-3.5-flash}
quarkus.rest-client.gemini.url=${GEMINI_URL:https://generativelanguage.googleapis.com}
quarkus.rest-client.gemini.read-timeout=120000

# ── Вклады GitHub (PRD §5.4, реестр I-01): «активность другого рода» рядом с шагами и сном.
#    Токена нет и не нужно: открытого API под календарь у GitHub не существует (REST его не
#    отдавал, GraphQL требует токен на каждый запрос), зато публичный HTML-фрагмент профиля
#    отдаёт год клеток с точными числами — и, в отличие от ленты событий, включает приватные
#    репозитории. Ходим на обычную страницу ⇒ интервал скромный, User-Agent честный.
danchuo.github.enabled=${DANCHUO_GITHUB_ENABLED:true}
danchuo.github.username=${DANCHUO_GITHUB_USERNAME:danchuo}
danchuo.github.poll-interval=${DANCHUO_GITHUB_POLL_INTERVAL:30m}
danchuo.github.user-agent=${DANCHUO_GITHUB_UA:danchuo.world/1.0 (https://danchuo.world)}
quarkus.rest-client.github-contributions.url=${GITHUB_URL:https://github.com}
quarkus.rest-client.github-contributions.read-timeout=10000

# ── Темы (PRD §5.9, §8, M4): токены активной волны почти статичны — кэшируем минутами.
#    Смена активной волны — редкое событие владельца; TTL гасит чтение из БД на каждый GET.
quarkus.cache.caffeine.theme-active.expire-after-write=5M
quarkus.cache.caffeine.theme-list.expire-after-write=5M

# ── Проекция дня (PRD §5.6, §8): плитка «Сегодня» со стриками дисциплины. Стрик считается
#    сканом истории назад — кэшируем проекцию, чтобы скан был раз на изменение данных, а не на
#    каждую перезагрузку. Инвалидация — из единой точки записи (DayRecordService). Ключ (date,
#    today) сам протухает в полночь MSK; ограничиваем окно и держим сутки как страховку.
quarkus.cache.caffeine.day-view.maximum-size=512
quarkus.cache.caffeine.day-view.expire-after-write=24H

# ── Деталь ночи (PRD §5.4, I-23): полоса ночи и профиль «обычной ночи» за 30 дней. Профиль —
#    скан месяца кусков, а переключают полосу туда-сюда; кэшируем и гасим на приёме кусков.
quarkus.cache.caffeine.sleep-night.maximum-size=256
quarkus.cache.caffeine.sleep-night.expire-after-write=24H

# ── Чеклист (PRD §5.6): окно ручного ввода дня — [сегодня − N, сегодня] по MSK.
#    Будущие даты и глубже окна ⇒ 400 (защита от опечатки в дате на телефоне).
danchuo.checklist.ingest-window-days=31

# ── Дневник (PRD §5.6): пункт «дневник перед сном» — производный. Приложение «Журнал» пишет
#    время в нём в HealthKit (Mindful Minutes), шорткат шлёт куски, бэк складывает их в вечернем
#    окне дня. Окно закрывается на следующих сутках (02:00 < 19:00) — запись в 00:40 закрывает
#    уходящий день, а не начинает наступивший. Ручная галочка в ingest/daily перекрывает минуты.
danchuo.journal.window-start=19:00
danchuo.journal.window-end=02:00
danchuo.journal.min-minutes=15

# ── Аналитика (PRD §5.11, M4): соль суточного хэша посетителя (ротируется датой внутри).
#    Сырой IP не хранится; в dev — дефолт, в prod ОБЯЗАТЕЛЬНО из env DANCHUO_ANALYTICS_SALT.
danchuo.analytics.salt=${DANCHUO_ANALYTICS_SALT:dev-analytics-salt-change-me}

# ── Хитмапа (PRD §5.11, B2): потайловый сбор кликов. Публичный POST защищён эшелонированно
#    (рейтлимит на IP + валидация). max-batch — потолок кликов в одном батче (длиннее отрезаем);
#    visitor-cap — сколько кликов одного посетителя в тайл засчитываем в агрегат (cap-вклада,
#    чтобы залитый спамом визит не перекрашивал картину — данные совещательные).
danchuo.analytics.heatmap.max-batch=50
danchuo.analytics.heatmap.visitor-cap=20

# ── Фото-дропы (PRD §5.12, B1): хранилище кадров. Сейчас — локальный диск за интерфейсом
#    PhotoStorage; позже подменяется на объектный сторадж (S3/R2) без правок слайса (§8).
#    Каталог раздаётся бэкендом через /api/film-media/*. В проде — смонтированный том.
danchuo.film.storage-dir=${DANCHUO_FILM_DIR:./data/film}
# Дотракты ресайза при загрузке (B1): web-вариант для модалки/борда, thumb — для сетки/превью.
danchuo.film.web-max-px=1600
danchuo.film.thumb-max-px=400
danchuo.film.jpeg-quality=0.82
# B9: LLM-проверка поворота кадров (слайс llm, vision). auto-check — гнать проверку в фоне
# сразу после аплоада дропа; троттлинг между vision-вызовами щадит рейт-лимит Groq free-tier.
# Без DANCHUO_LLM_API_KEY проверка тихо помечает кадры пропущенными (контракт LlmClient).
danchuo.film.orientation.auto-check=${DANCHUO_FILM_ORIENTATION_AUTO_CHECK:true}
danchuo.film.orientation.throttle-ms=${DANCHUO_FILM_ORIENTATION_THROTTLE_MS:2500}
#    Поиск артефактов на кадрах (§5.12) — запускается только вручную из /admin: прогон стоит
#    денег, а дроп из 36 кадров это 36 обращений к модели.
#
#    Паузы между кадрами НЕТ, и это осознанно. 2500 мс подбирались под бесплатный тариф Gemini
#    с его 5 запросами в минуту; на платном они стали чистым ожиданием. Замер на живом прогоне
#    прода: 6 с на кадр, из них 3.5 с — ответ модели и 2.5 с — эта пауза, то есть 9 минут из 21
#    уходили в сон. Роль рейт-лимитера здесь играет сама последовательность: воркер один, кадры
#    строго друг за другом, и латентность модели держит темп около 17 запросов в минуту — на
#    порядки ниже платных квот.
#
#    ⚠️ Если прогон когда-нибудь станет параллельным, ноль перестанет быть безопасным: пул без
#    паузы даёт залп. Тогда нужен не этот sleep, а рейт-лимитер с ретраями по 429 — сейчас 429
#    молча превращается в пропущенный кадр (`Unavailable`), и в параллель это дало бы «успешный»
#    прогон с дырками. Ручка оставлена именно на такой случай.
danchuo.film.artifacts.throttle-ms=${DANCHUO_FILM_ARTIFACTS_THROTTLE_MS:0}

# ── Картинки артефактов, заведённых через /admin (§5.8). Подкаталог хранилища дропов: в проде
#    это уже смонтированный том, второй ради нескольких картинок заводить незачем.
danchuo.artifacts.storage-dir=${DANCHUO_ARTIFACTS_DIR:${danchuo.film.storage-dir}/artifacts}
# Промты LLM лежат ресурсами (prompts/*.txt) — в native-образ ресурсы сами не попадают.
quarkus.native.resources.includes=prompts/**

# Загрузка zip фото-дропа (~36 кадров с телефона) — крупное тело; поднимаем лимит.
# Это касается только multipart на /api/ingest/drops; обычные JSON-запросы крошечные.
quarkus.http.limits.max-body-size=512M

# ── Рейтлимит публичных GET (PRD §3, §8, M4): мягкий анти-абуз одного клиента (не анти-DDoS).
#    Бакет на IP: лимит запросов в окно (секунды). 0 ⇒ выключить (напр. в тестах/деве).
danchuo.ratelimit.requests=120
danchuo.ratelimit.window-seconds=60

# ── Профиль dev/test: Dev Services сам поднимает Postgres в Docker (url не задаём) ──
%dev.quarkus.hibernate-orm.log.sql=true
# В тестах рейтлимит выключен — иначе серия запросов одного клиента (RestAssured) ложно 429.
%test.danchuo.ratelimit.requests=0
# Фото-дропы в тестах — в build-каталог (не засоряем дефолтный ./data/film).
%test.danchuo.film.storage-dir=build/film-test
# Проверку поворота в тестах не автозапускаем (фоновые джобы ⇒ недетерминизм) и не троттлим.
%test.danchuo.film.orientation.auto-check=false
%test.danchuo.film.orientation.throttle-ms=0
%test.danchuo.film.artifacts.throttle-ms=0
%test.danchuo.artifacts.storage-dir=build/artifacts-test
# Тесты не ходят во внешние модели. Пустой ключ ⇒ клиент отдаёт null, и проверяется именно
# путь деградации. Без этого Quarkus подхватывает backend/.env, и прогон тестов тратил бы
# настоящую квоту (у Gemini — оплаченную), а результат зависел бы от сети.
%test.danchuo.llm.api-key=
%test.danchuo.gemini.api-key=
# Геокодер станций в тестах выключен (фоновый @Scheduled + внешний Nominatim ⇒ недетерминизм).
%test.danchuo.bike.geocode.enabled=false
# Сборщик вкладов в тестах молчит: наружу за HTML не ходим, дни сеются фикстурами.
%test.danchuo.github.enabled=false

# ── Профиль prod: всё строго из env, без дефолтов-заглушек ──
%prod.quarkus.datasource.jdbc.url=${DANCHUO_DB_URL}
%prod.quarkus.datasource.username=${DANCHUO_DB_USER}
%prod.quarkus.datasource.password=${DANCHUO_DB_PASSWORD}
%prod.danchuo.ingest.token=${DANCHUO_INGEST_TOKEN}
%prod.danchuo.analytics.salt=${DANCHUO_ANALYTICS_SALT}
# Каталог фото-дропов в проде — смонтированный том (не эфемерный слой контейнера).
%prod.danchuo.film.storage-dir=${DANCHUO_FILM_DIR}
# Spotify-креды опциональны (слайс грузится «не сконфигурирован», если их нет) — базовые
# `danchuo.spotify.*` выше уже читают те же env с пустыми дефолтами и действуют в проде.
# Задать DANCHUO_SPOTIFY_* в env — слайс включится без правок конфига.
