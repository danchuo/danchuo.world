# ───────────── danchuo.world · backend ─────────────
quarkus.application.name=danchuo-world
quarkus.http.port=8080

# ── Cross-cutting time conventions (PRD §4, CLAUDE.md): MSK canon plus genesis ──
danchuo.time.zone=Europe/Moscow
danchuo.time.genesis=2026-01-01

# ── Write credentials (PRD §3, §7): a static bearer on /api/ingest/*; every GET is public.

#    A dev default for convenience; in prod it MUST come from DANCHUO_INGEST_TOKEN.
danchuo.ingest.token=${DANCHUO_INGEST_TOKEN:dev-ingest-token-change-me}

# No CORS needed: the frontend reaches the API on the same origin through a reverse proxy
# (Caddy in prod, the Next /api/* proxy in docker-compose). Same-origin by architecture.

# ── Datasource (PostgreSQL) ──
quarkus.datasource.db-kind=postgresql

# ── Liquibase owns the schema, not hbm2ddl (it replaced Flyway).
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml
quarkus.hibernate-orm.database.generation=none
# JSONB columns: Hibernate uses its own JSON format rather than REST-Jackson, since their
# serialisation is not customised. This becomes the default in later Quarkus.
quarkus.hibernate-orm.mapping.format.global=ignore

# ── Spotify (PRD §5.5): external OAuth and cache, isolated in the spotify slice. ──

#    Until the app is registered these are empty — the slice answers "not_configured" instead
#    of failing. Secrets in prod come strictly from env (see %prod below).
danchuo.spotify.client-id=${DANCHUO_SPOTIFY_CLIENT_ID:}
danchuo.spotify.client-secret=${DANCHUO_SPOTIFY_CLIENT_SECRET:}
# Spotify requires https; the one exception is a loopback IP over http (127.0.0.1, not localhost).
danchuo.spotify.redirect-uri=${DANCHUO_SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/api/spotify/callback}
# AES-256 key encrypting the refresh token at rest: 32 bytes in Base64 (openssl rand -base64 32).
danchuo.spotify.token-encryption-key=${DANCHUO_SPOTIFY_TOKEN_KEY:}

# Base URLs of external Spotify, in config so a test can point them at a mock server.
quarkus.rest-client.spotify-accounts.url=https://accounts.spotify.com
quarkus.rest-client.spotify-api.url=https://api.spotify.com

# The cache absorbs load and keeps within Spotify's limits (PRD §8). TTLs live with the
# owning slice.
quarkus.cache.caffeine.spotify-now-playing.expire-after-write=20S
quarkus.cache.caffeine.spotify-recent.expire-after-write=5M
quarkus.cache.caffeine.spotify-top.expire-after-write=30M
# Playlist and artist names barely change, and resolving a source name costs an extra request.
quarkus.cache.caffeine.spotify-source-name.expire-after-write=30M

# Recording listened podcasts (PRD §5.6): Spotify serves episode history on no endpoint at all,
# so it is written here by polling the player every minute. Unlike the now-playing cache above,
# this poll runs ALWAYS — that one only wakes when somebody opens the board.
danchuo.spotify.podcast.enabled=true
danchuo.spotify.podcast.poll-interval=60s
danchuo.spotify.podcast.market=RU
danchuo.spotify.podcast.session-gap-minutes=15
danchuo.spotify.podcast.run-gap-minutes=45
# Retelling what was heard (PRD §5.16.1): ready transcripts do not exist — Spotify has no public
# API, and the podcast:transcript tag was found on 0 of 6 episodes in the owner's library. The
# text is obtained here: Apple catalogue → RSS → audio windows by Range → transcription.
danchuo.spotify.podcast.summary.enabled=${DANCHUO_PODCAST_SUMMARY_ENABLED:true}
danchuo.spotify.podcast.summary.itunes-url=https://itunes.apple.com
# Four three-minute windows: 720 audio-seconds against a 7200/hour limit, giving ~9k characters
# of transcript under the 12k excerpt ceiling. The cut happens BEFORE transcription — an hour of
# speech is ~46k characters, which windowing would discard anyway, only after paying for it.
danchuo.spotify.podcast.summary.windows=4
danchuo.spotify.podcast.summary.window-ms=180000
# Ceiling per slice: three minutes at 320 kbps is 7 MB, well under the provider's 25 MB, so this
# only fires on something abnormal.
danchuo.spotify.podcast.summary.max-slice-bytes=20000000
danchuo.spotify.podcast.summary.connect-timeout-seconds=10
danchuo.spotify.podcast.summary.read-timeout-seconds=120

# ── Velobike (PRD §9 B4): ride history, external source isolated in the bike slice. ──

#    The push channel (ingest from a browser or shortcut) works with no config. Server polling
#    needs both an encryption key AND a proxy (the API sits behind Qrator), so it is off by default.
danchuo.bike.phone=${DANCHUO_BIKE_PHONE:}
danchuo.bike.token-encryption-key=${DANCHUO_BIKE_TOKEN_KEY:}
danchuo.bike.poll-enabled=${DANCHUO_BIKE_POLL_ENABLED:false}
danchuo.bike.poll-interval=${DANCHUO_BIKE_POLL_INTERVAL:6h}
# Public GET /api/rides serves the current calendar year (MSK); if the year is empty, the single
# freshest ride instead. Everything pushed is kept.

# External Velobike API URL (a test or proxy may replace it). The residential proxy that gets
# past Qrator is configured here too when polling is enabled, e.g.
#   quarkus.rest-client.velobike.proxy-address=user-proxy-host:1080
quarkus.rest-client.velobike.url=https://pwa.velobike.ru

# Station geocoder (PRD §5.13): the map draws pins from the bike's raw GPS, which in Moscow often
# flies off. A station's address is reliable but Velobike does not serve its coordinates, so the
# address is geocoded in the background (OSM Nominatim), one per tick, and cached.
danchuo.bike.geocode.enabled=${DANCHUO_BIKE_GEOCODE_ENABLED:true}
danchuo.bike.geocode.interval=${DANCHUO_BIKE_GEOCODE_INTERVAL:5s}
danchuo.bike.geocode.user-agent=${DANCHUO_BIKE_GEOCODE_UA:danchuo.world/1.0 (https://danchuo.world)}
quarkus.rest-client.nominatim.url=${NOMINATIM_URL:https://nominatim.openstreetmap.org}
quarkus.rest-client.nominatim.read-timeout=10000

# ── LLM (PRD §9 backlog): external model provider, isolated in the `llm` slice (like spotify/bike).

#    Groq's OpenAI-compatible API (https://console.groq.com/keys). Empty api-key ⇒ no external
#    calls, LlmClient returns null and callers degrade gracefully. Secrets in prod — env only.

#    `model` is text completions and `vision-model` image inputs (photo-drop orientation checks);
#    `provider` picks the implementation: groq (default) or gemini.
danchuo.llm.provider=${DANCHUO_LLM_PROVIDER:groq}
danchuo.llm.api-key=${DANCHUO_LLM_API_KEY:}
#    NB: a Groq model has already vanished under us twice, and a withdrawal looks like an HTTP 404
#    that the client turns into a silent null. So the main lane's text model is the same qwen as the
#    vision one: `reasoning-effort` below is ONE for both, and gpt-oss (FREE lane) rejects `none`.
danchuo.llm.model=${DANCHUO_LLM_MODEL:qwen/qwen3.6-27b}
#    qwen3.6-27b is the only vision model Groq still serves, and it needs `reasoning_effort: none`
#    or it spends the whole answer budget thinking. Measured against Gemini on real drop frames:
#    its object coordinates are unusable (PRD §5.12), which is why prod runs gemini.
danchuo.llm.vision-model=${DANCHUO_LLM_VISION_MODEL:qwen/qwen3.6-27b}
#    `none` silences thinking aloud — without it qwen spends the whole answer limit inside <think>
#    and breaks off before replying, which from outside looks like the model failing. Empty means
#    do not send the parameter at all: models that do not know it reject the request entirely.
danchuo.llm.reasoning-effort=${DANCHUO_LLM_REASONING_EFFORT:none}
quarkus.rest-client.groq.url=${GROQ_URL:https://api.groq.com}

#    ── The free lane (LlmLane.FREE). Anything that can wait a poller tick goes HERE rather than to
#    the main lane: retelling what was read (PRD §5.16) accumulates book after book, and paying for
#    it is pointless. Its provider is its own and need not match the main one.

#    The previous llama-3.3-70b was withdrawn by Groq and took ALL retellings with it. Measured with
#    a live retelling prompt across the four remaining models, gpt-oss-120b was chosen as the
#    largest; `groq/compound` was rejected — its own wrapper inflates the prompt fourfold.

#    `low` here is MANDATORY for two reasons: without it gpt-oss thinks at medium effort by default
#    (418 answer tokens against 180 at equal quality), and it rejects the neighbouring lane's `none`
#    along with the whole request. One call per tick fits inside the 8k tokens/min free limit.
danchuo.llm.free-provider=${DANCHUO_LLM_FREE_PROVIDER:groq}
danchuo.llm.free-model=${DANCHUO_LLM_FREE_MODEL:openai/gpt-oss-120b}
danchuo.llm.free-reasoning-effort=${DANCHUO_LLM_FREE_REASONING_EFFORT:low}

#    ── Speech recognition (PRD §5.16.1): transcribing an audio window of an episode. Its limit is its
#    OWN — audio-seconds (7200 an hour free) rather than tokens per minute, so transcription and text
#    retelling do not take budget from each other. Multipart, hence a client of its own.
danchuo.llm.transcribe-model=${DANCHUO_LLM_TRANSCRIBE_MODEL:whisper-large-v3-turbo}
danchuo.llm.transcribe-url=${DANCHUO_LLM_TRANSCRIBE_URL:https://api.groq.com/openai/v1/audio/transcriptions}

# ── Gemini (Google AI Studio): used when danchuo.llm.provider=gemini. Same degradation contract —

#    empty api-key ⇒ no external call, null reply. The free tier is 20 requests/day per model, enough
#    to smoke-test but not to sweep a drop.

#    ⚠️ Unlike Groq it constrains replies to a JSON schema and returns box coordinates as
#    [ymin, xmin, ymax, xmax] scaled 0..1000 — y first.
danchuo.gemini.api-key=${GEMINI_API_KEY:}
danchuo.gemini.model=${DANCHUO_GEMINI_MODEL:gemini-3.5-flash}
danchuo.gemini.vision-model=${DANCHUO_GEMINI_VISION_MODEL:gemini-3.5-flash}
quarkus.rest-client.gemini.url=${GEMINI_URL:https://generativelanguage.googleapis.com}
quarkus.rest-client.gemini.read-timeout=120000

# ── GitHub contributions (PRD §5.4): "activity of another kind" beside steps and sleep.

#    No token is needed or possible: GitHub has no public API for the calendar, while the public HTML
#    profile fragment serves a year of cells with exact figures and, unlike the events feed, includes
#    private repositories.

#    This is an ordinary page, so the interval is modest and the User-Agent honest.
danchuo.github.enabled=${DANCHUO_GITHUB_ENABLED:true}
danchuo.github.username=${DANCHUO_GITHUB_USERNAME:danchuo}
danchuo.github.poll-interval=${DANCHUO_GITHUB_POLL_INTERVAL:30m}
danchuo.github.user-agent=${DANCHUO_GITHUB_UA:danchuo.world/1.0 (https://danchuo.world)}
quarkus.rest-client.github-contributions.url=${GITHUB_URL:https://github.com}
quarkus.rest-client.github-contributions.read-timeout=10000

# ── Telegram card (PRD §5.18): the owner's name, status and avatar under the social mark.

#    Telegram offers no API channel (the Bot API sees only people who wrote to the bot, MTProto needs
#    a session), while the public t.me/{handle} page serves og markup to anonymous readers. It changes
#    once in years, so the interval is an hour.
danchuo.telegram.enabled=${DANCHUO_TELEGRAM_ENABLED:true}
danchuo.telegram.username=${DANCHUO_TELEGRAM_USERNAME:danchuo}
danchuo.telegram.poll-interval=${DANCHUO_TELEGRAM_POLL_INTERVAL:1h}
danchuo.telegram.user-agent=${DANCHUO_TELEGRAM_UA:danchuo.world/1.0 (https://danchuo.world)}
quarkus.rest-client.telegram-page.url=${TELEGRAM_URL:https://t.me}
quarkus.rest-client.telegram-page.read-timeout=10000
quarkus.rest-client.telegram-page.follow-redirects=true

# ── Day projection (PRD §5.6, §8): the "Today" tile with discipline streaks. A streak is computed by
#    scanning history backwards, so the projection is cached and that scan happens once per data change
#    rather than once per reload, invalidated from the single write point (DayRecordService).

#    The (date, today) cache key expires by itself at MSK midnight; the window is bounded and a day is
#    kept as insurance.
quarkus.cache.caffeine.day-view.maximum-size=512
quarkus.cache.caffeine.day-view.expire-after-write=24H

# ── Night detail (PRD §5.4): the night band and a 30-day "typical night" profile. The profile is
#    a month-long scan of chunks while the band gets toggled back and forth, so it is cached and
#    invalidated when chunks are ingested.
quarkus.cache.caffeine.sleep-night.maximum-size=256
quarkus.cache.caffeine.sleep-night.expire-after-write=24H

# ── Checklist (PRD §5.6): the manual entry window is [today − N, today] in MSK.

#    Future dates and anything deeper than the window ⇒ 400, guarding against a typo on the phone.
danchuo.checklist.ingest-window-days=31

# ── Journal (PRD §5.6): the "journal before bed" item is derived. The Journal app writes its time
#    into HealthKit (Mindful Minutes), the shortcut posts chunks, and the backend sums them in the
#    day's evening window. A manual tick in ingest/daily overrides the minutes.

#    The window closes on the NEXT calendar day (02:00 < 19:00), so an entry at 00:40 closes the day
#    that is ending rather than starting the one that has just begun.
danchuo.journal.window-start=19:00
danchuo.journal.window-end=02:00
danchuo.journal.min-minutes=15

# ── Analytics (PRD §5.11): salt for the visitor's daily hash (rotated by the date inside it).

#    No raw IP is stored; a dev default here, in prod strictly from DANCHUO_ANALYTICS_SALT.
danchuo.analytics.salt=${DANCHUO_ANALYTICS_SALT:dev-analytics-salt-change-me}

# ── Heatmap (PRD §5.11): per-tile click collection. The public POST is defended in depth (IP rate
#    limit plus validation). max-batch caps the clicks in one batch, and visitor-cap how many of one
#    visitor's clicks per tile reach the aggregate, so a spammed visit cannot repaint the picture.
danchuo.analytics.heatmap.max-batch=50
danchuo.analytics.heatmap.visitor-cap=20
#    grid: the lattice a tile's click cloud is binned to. 6x6 is what stays readable inside a
#    small tile of the admin overlay; raw points would grow with traffic, bins do not.
danchuo.analytics.heatmap.grid=6

# -- Summary (PRD §5.11): a visit counts as engaged on foreground time OR any click of its own.
#    10s is GA4's default; a one-page board cannot offer the second pageview its rule also takes.
danchuo.analytics.engaged-ms=10000
#    Rows per breakdown on the dashboard: the tail of a dimension is noise, not a reading.
danchuo.analytics.breakdown-limit=12

# -- Retention (PRD §5.11): raw telemetry is purged past the horizon rather than rolled up.
danchuo.analytics.retention-days=400
danchuo.analytics.retention.interval=24h

# ── Photo drops (PRD §5.12): frame storage. Currently local disk behind the PhotoStorage
#    interface; later swappable for object storage (S3/R2) with no slice edits (§8). The directory
#    is served by the backend through /api/film-media/*; in prod it is a mounted volume.
danchuo.film.storage-dir=${DANCHUO_FILM_DIR:./data/film}

# ── Instagram (PRD §5.17): the owner's latest post. As with spotify, OAuth and the token live
#    entirely in the slice. The account must be Professional (Creator/Business) — no official
#    access to personal accounts remains. Empty credentials ⇒ the slice stays quiet, not broken.
danchuo.instagram.client-id=${DANCHUO_INSTAGRAM_CLIENT_ID:}
danchuo.instagram.client-secret=${DANCHUO_INSTAGRAM_CLIENT_SECRET:}
# Instagram accepts https only, so there can be no loopback default here.
danchuo.instagram.redirect-uri=${DANCHUO_INSTAGRAM_REDIRECT_URI:}
danchuo.instagram.token-encryption-key=${DANCHUO_INSTAGRAM_TOKEN_KEY:}
danchuo.instagram.enabled=${DANCHUO_INSTAGRAM_ENABLED:true}
danchuo.instagram.poll-interval=30m
danchuo.instagram.storage-dir=${DANCHUO_INSTAGRAM_DIR:${danchuo.film.storage-dir}/instagram}

quarkus.rest-client.instagram-auth.url=https://api.instagram.com
quarkus.rest-client.instagram-graph.url=https://graph.instagram.com


# Resize contracts on upload: the web variant for the modal and board, thumb for grid and preview.
danchuo.film.web-max-px=1600
danchuo.film.thumb-max-px=400
danchuo.film.jpeg-quality=0.82
# The day's photo opens full-screen, so it keeps more: 2560 covers a 1920 screen and most retina.
danchuo.days.photo-max-px=2560
danchuo.days.photo-jpeg-quality=0.92
# LLM check of frame orientation (llm slice, vision). auto-check runs it in the background right
# after a drop is uploaded; the throttle between vision calls spares Groq's free-tier rate limit.
# Without DANCHUO_LLM_API_KEY the check quietly marks frames skipped (the LlmClient contract).
danchuo.film.orientation.auto-check=${DANCHUO_FILM_ORIENTATION_AUTO_CHECK:true}
danchuo.film.orientation.throttle-ms=${DANCHUO_FILM_ORIENTATION_THROTTLE_MS:2500}
#    Artifact detection on frames (PRD §5.12) runs only by hand from /admin: a sweep costs money,
#    and a 36-frame drop is 36 calls to the model.

#    There is deliberately NO pause between frames. 2500 ms was tuned for Gemini's free tier and its
#    5 requests per minute; on the paid tier it became pure waiting — measured on a live prod sweep,
#    9 minutes out of 21 went into sleeping.

#    The sequence itself is the rate limiter: one worker, frames strictly one after another, and the
#    model's latency holds ~17 requests a minute, orders below the paid quota.

#    ⚠️ Should a sweep ever become parallel, zero stops being safe: a pool with no pause fires a
#    volley, and what is needed then is a rate limiter with 429 retries. Today a 429 silently becomes
#    a skipped frame, which in parallel would give a "successful" sweep full of holes.
danchuo.film.artifacts.throttle-ms=${DANCHUO_FILM_ARTIFACTS_THROTTLE_MS:0}

# ── Images of artifacts entered through /admin (PRD §5.8). A subdirectory of the drop storage: in
#    prod that is already a mounted volume, and a second one for a few pictures is not worth it.
danchuo.artifacts.storage-dir=${DANCHUO_ARTIFACTS_DIR:${danchuo.film.storage-dir}/artifacts}
# LLM prompts are resources (prompts/*.txt), and resources do not reach a native image by themselves.
quarkus.native.resources.includes=prompts/**

# A photo-drop zip (~36 frames from the phone) is a large body, so the limit is raised. This
# affects only multipart on /api/ingest/drops; ordinary JSON requests are tiny.
quarkus.http.limits.max-body-size=512M

# ── Reading (PRD §5.16, reading slice): the Anx Reader shelf, arriving over WebDAV. ──

#    The directory is the shelf root: inside it the reader keeps `anx/database<N>.db` and
#    `anx/data/cover/*`. An empty path ⇒ the slice is "not configured" and stays quiet.
danchuo.reading.shelf-dir=${DANCHUO_READING_DIR:./data/anx}
danchuo.reading.enabled=true
# The poll is deliberately rare: the reader uploads its database ITSELF when the app is backgrounded,
# so there is nothing to poll for more often — the file changes a couple of times a day. No minutes
# are lost: the reader counts them, and this only collects what has accumulated.
danchuo.reading.poll-interval=5m
# The pause after which a continuation counts as a new reading session rather than the same one.
danchuo.reading.session-gap-minutes=45
# Opening a book to glance at it is not reading: under a minute no new session is started, and the
# seconds are not lost — they wait for the next increment. An already open session is unaffected.
danchuo.reading.min-session-seconds=60

# ── Retelling the chunk covered in a sitting (PRD §5.16, summary slice) ──

#    The settings are shared by ALL sources deliberately: the excerpt ceiling and the queue tick are
#    measured not in books but in the model's free lane (LlmLane.FREE), one for everybody. ONE sitting
#    per tick — that limit is per minute, not per speed.
danchuo.summary.enabled=${DANCHUO_SUMMARY_ENABLED:true}
danchuo.summary.interval=2m
# Excerpt ceiling in characters. 12k ≈ 5k Cyrillic tokens, which fits even the meanest free limit,
# with room for prompt and reply. A longer chunk is taken as windows across its whole length rather
# than truncated at the start (see SummaryWindows).
danchuo.summary.max-chars=12000
# How many times to attempt a sitting before leaving it without a retelling. A miss is either an
# unavailable model or a book missing from the shelf; both heal with time, but hammering at them
# indefinitely is pointless.
danchuo.summary.max-attempts=3
# A sitting does not freeze once retold: return to the book within the gap and the poller extends THAT
# SAME row, so text about its beginning stops answering for it as a whole. It is rebuilt once the
# sitting has moved on by this fraction — less is indistinguishable from the reader's own rounding.
danchuo.summary.refresh-fraction=0.02

# ── Rate limit on public GETs (PRD §3, §8): soft anti-abuse of one client, not anti-DDoS.

#    A bucket per IP: requests per window in seconds. 0 ⇒ the whole filter is off (tests, dev).
danchuo.ratelimit.requests=120
danchuo.ratelimit.window-seconds=60
# Photo-drop frames get a separate bucket: one drop's gallery is ~36 pictures, and on a shared limit
# the board plus three open drops (≈130 requests) hit 429 for a real person. Measured: the endpoint
# holds 250 rps at p50 163ms and the heaviest honest minute is ~260 requests, so 600 is twofold.
danchuo.ratelimit.media-requests=600
# Notes get their own hour-long window. The ceiling is set by the peak it must survive: the site
# passed round a company on one office NAT, all of them the same {remote_host}. Sized to lose no
# honest note there, and still far under what a script needs to be worth writing. PRD §5.19
danchuo.ratelimit.feedback-requests=50
danchuo.ratelimit.feedback-window-seconds=3600
# Tier lists have their own, tighter bucket over the same window: an honest visitor publishes one or
# two, and the public shelf shows only the newest, so a flood from one client buries everyone else. PRD §5.20
danchuo.ratelimit.tierlist-requests=25

# ── dev/test profile: Dev Services raises Postgres in Docker itself, so no url is set ──
%dev.quarkus.hibernate-orm.log.sql=true
# The rate limit is off in tests, or a series of requests from one client (RestAssured) falsely 429s.
%test.danchuo.ratelimit.requests=0
# Photo drops in tests go to the build directory rather than polluting the default ./data/film.
%test.danchuo.film.storage-dir=build/film-test
# The orientation check is not auto-run in tests (background jobs ⇒ nondeterminism) and not throttled.
%test.danchuo.film.orientation.auto-check=false
%test.danchuo.film.orientation.throttle-ms=0
%test.danchuo.film.artifacts.throttle-ms=0
%test.danchuo.artifacts.storage-dir=build/artifacts-test
# Tests never reach external models. An empty key ⇒ the client returns null, so the degradation path
# is what gets exercised. Without this Quarkus picks up backend/.env and a test run would spend real
# quota (paid, with Gemini) while its result depended on the network.
%test.danchuo.llm.api-key=
%test.danchuo.gemini.api-key=
# The station geocoder is off in tests (a background @Scheduled plus external Nominatim ⇒ nondeterminism).
%test.danchuo.bike.geocode.enabled=false
# The contributions collector is quiet in tests: no HTML fetching outside, days are seeded by fixtures.
%test.danchuo.github.enabled=false
# The Telegram card is quiet in tests for the same reason: @Scheduled would reach out to t.me.
%test.danchuo.telegram.enabled=false
# The podcast poller is off in tests: a once-a-minute @Scheduled would reach live Spotify (Quarkus
# picks the credentials up from backend/.env) and write sessions past the fixtures.
%test.danchuo.spotify.podcast.enabled=false
# External sources stay quiet in tests, or a run would reach into somebody's feed.
%test.danchuo.instagram.enabled=false
%test.danchuo.instagram.storage-dir=build/instagram-test
# Fetching an episode's text is quiet in tests: it reaches the Apple catalogue, third-party feeds and
# transcription. Feed parsing and window slicing are still checked by pure tests, which need no network.
%test.danchuo.spotify.podcast.summary.enabled=false
# The reading poller is off in tests: @Scheduled would reach into the developer's shelf (or its
# absence) and write sessions past the fixtures. The shelf itself lives in the build directory.
%test.danchuo.reading.enabled=false
%test.danchuo.reading.shelf-dir=build/anx-test
# The background retelling counter is quiet for the same reason: it would call the model and write
# rows past the fixtures. Generation itself is checked by calling the service directly.
%test.danchuo.summary.enabled=false

# ── prod profile: everything strictly from env, no placeholder defaults ──
%prod.quarkus.datasource.jdbc.url=${DANCHUO_DB_URL}
%prod.quarkus.datasource.username=${DANCHUO_DB_USER}
%prod.quarkus.datasource.password=${DANCHUO_DB_PASSWORD}
%prod.danchuo.ingest.token=${DANCHUO_INGEST_TOKEN}
%prod.danchuo.analytics.salt=${DANCHUO_ANALYTICS_SALT}
# The photo-drop directory in prod is a mounted volume, not the container's ephemeral layer.
%prod.danchuo.film.storage-dir=${DANCHUO_FILM_DIR}
# The Anx Reader shelf in prod is a volume shared with the webdav service, mounted read-only here.
%prod.danchuo.reading.shelf-dir=${DANCHUO_READING_DIR}
# Spotify credentials are optional (the slice loads as "not configured" without them) — the base
# `danchuo.spotify.*` entries above already read the same env with empty defaults and apply in prod.
# Set DANCHUO_SPOTIFY_* in env and the slice switches on with no config edit.
