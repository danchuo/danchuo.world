# danchuo.world — the local stack (PRD §8). One command: docker compose up --build
#   site → http://localhost:3000 · API → http://localhost:8080 · postgres → localhost:5432

# `restart: unless-stopped` everywhere is not decoration: the stack is the project's shop window
# ("localhost:3000 is always live", CLAUDE.md), and without it the stack survived neither a machine
# reboot nor a Docker Desktop restart, going dark until the next manual `up`.

# ⚠️ Port 8080 belongs to THIS stack alone. Do not run `quarkusDev` beside it: it listens on
# 127.0.0.1:8080 while the container binds 0.0.0.0:8080, and on loopback the narrower binding wins,
# so `localhost:8080` and `http://backend:8080` answer from different processes (docs/pitfalls.md).

# This is a TEST config: default credentials and token are open deliberately. Production takes
# its secrets from env and sits behind Caddy with TLS.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: danchuo
      POSTGRES_USER: danchuo
      POSTGRES_PASSWORD: danchuo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danchuo -d danchuo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Spotify credentials (PRD §5.5) come from backend/.env, which is gitignored so no secrets
    # live in the repository. No file ⇒ the slice loads as "not configured" rather than failing.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # The prod profile (the packaged Quarkus default) reads datasource and token strictly from env.
      DANCHUO_DB_URL: jdbc:postgresql://postgres:5432/danchuo
      DANCHUO_DB_USER: danchuo
      DANCHUO_DB_PASSWORD: danchuo
      DANCHUO_INGEST_TOKEN: dev-ingest-token-change-me
      # Salt for the analytics daily hash (PRD §5.11): mandatory from env in the prod profile.
      # This being a test config, the default is open deliberately, like the ingest token above.
      DANCHUO_ANALYTICS_SALT: dev-analytics-salt-change-me
      # Genesis date (no data exists before it, PRD §4) — the start of the year, for testing.
      DANCHUO_TIME_GENESIS: "2026-01-01"
      # Photo-drop frame directory (PRD §5.12), mandatory from env in the prod profile. A named
      # volume is mounted below so uploaded drops survive a container rebuild.
      DANCHUO_FILM_DIR: /data/film
      # Anx Reader shelf root (PRD §5.16): the phone pushes its database here over WebDAV and the
      # reading poller reads it back. The volume is shared with the webdav service but mounted :ro —
      # the backend is a reader, and the only write channel is WebDAV itself.
      DANCHUO_READING_DIR: /data/anx
    ports:
      - "8080:8080"
    volumes:
      - filmdata:/data/film
      - anxdata:/data/anx:ro
    depends_on:
      postgres:
        condition: service_healthy

  # WebDAV endpoint for the Anx Reader sync. Locally it is exposed by port (a phone on the same
  # network reaches http://<machine-ip>:6065/dav); in prod the same container sits behind Caddy.
  webdav:
    image: ghcr.io/hacdias/webdav:v5
    restart: unless-stopped
    command: ["-c", "/config.yml"]
    environment:
      # Test stack: credentials are open deliberately, like the ingest token above. Prod uses .env.
      WEBDAV_USERNAME: danchuo
      WEBDAV_PASSWORD: dev-webdav-change-me
    ports:
      - "6065:6065"
    volumes:
      - ./webdav.yml:/config.yml:ro
      - anxdata:/data

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        # The browser stays on the same origin (/api/*) and the Next server proxies to the backend
        # by its docker service name, so no CORS is needed — this mirrors prod behind Caddy. The
        # target is baked into rewrites at build time, hence a build-arg.
        API_PROXY_TARGET: http://backend:8080
        # robots.txt, sitemap.xml and opengraph-image are prerendered statically at build time, so
        # SITE_URL has to be a build-arg or the prod default would be baked into them.
        SITE_URL: http://localhost:3000
    environment:
      # SSR inject of the active wave's tokens: the Next server fetches /api/theme/active by the
      # backend's internal docker name, while browser /api/* calls go through the rewrites above.
      API_INTERNAL_URL: http://backend:8080
      # The site's base URL (OG image, canonical, robots.txt, sitemap.xml). Without it the frontend
      # falls back to the prod default https://danchuo.world, so the local stack sets localhost.
      SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      # Encoded AVIF photos survive a rebuild, as they do a deploy (docker-compose.prod.yml).
      - imgcache:/app/.next/cache/images
    depends_on:
      - backend

volumes:
  pgdata:
  filmdata:
  anxdata:
  imgcache:
