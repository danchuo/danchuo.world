# danchuo.world — локальный стек для тестирования (PRD §8, расцепленный монолит).
# Полный прогон одной командой:  docker compose up --build
#   • сайт   → http://localhost:3000
#   • API    → http://localhost:8080/api/days/<дата>
#   • postgres → localhost:5432 (danchuo/danchuo)
# Это ТЕСТОВЫЙ конфиг: дефолтные креды и токен открыты намеренно. Не для прода
# (там — env-секреты + Caddy/TLS, отдельный deploy-compose появится в эру деплоя).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: danchuo
      POSTGRES_USER: danchuo
      POSTGRES_PASSWORD: danchuo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danchuo -d danchuo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Spotify-креды (PRD §M3) подтягиваются из backend/.env (он в .gitignore, секреты
    # не в репозитории). Файла нет ⇒ слайс грузится «не сконфигурирован», не падает.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Профиль prod (дефолт упакованного Quarkus) читает датасорс/токен строго из env.
      DANCHUO_DB_URL: jdbc:postgresql://postgres:5432/danchuo
      DANCHUO_DB_USER: danchuo
      DANCHUO_DB_PASSWORD: danchuo
      DANCHUO_INGEST_TOKEN: dev-ingest-token-change-me
      # Соль суточного хэша аналитики (PRD §5.11): в prod-профиле обязательна из env.
      # Это тестовый конфиг — дефолтное значение открыто намеренно (как ingest-токен выше).
      DANCHUO_ANALYTICS_SALT: dev-analytics-salt-change-me
      # Генезис-дата (раньше неё данных нет, PRD §4) — для теста ставим начало года.
      DANCHUO_TIME_GENESIS: "2026-01-01"
      # Каталог кадров фото-дропов (B1, PRD §5.12). В prod-профиле обязателен из env;
      # монтируем именованный том ниже, чтобы загруженные дропы переживали пересборку контейнера.
      DANCHUO_FILM_DIR: /data/film
    ports:
      - "8080:8080"
    volumes:
      - filmdata:/data/film
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Браузер ходит на тот же origin (/api/*), Next-сервер проксирует на бэкенд
        # по docker-имени сервиса — CORS не нужен (зеркалит прод за Caddy).
        # Цель запекается в rewrites на build-time, поэтому это build-arg.
        API_PROXY_TARGET: http://backend:8080
    environment:
      # SSR-инжект токенов активной волны (M4): Next-сервер тянет /api/theme/active по
      # внутреннему docker-имени бэкенда (браузерные /api/* идут через rewrites выше).
      API_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  filmdata:
